user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log;
pid /run/nginx.pid;

include /usr/share/nginx/modules/*.conf;

events {
  worker_connections 1024;
}

http {
  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent" "$http_x_forwarded_for"';

  access_log /var/log/nginx/access.log main;

  sendfile            on;
  tcp_nopush          on;
  keepalive_timeout   65;
  types_hash_max_size 4096;

  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  # Single server block, no conf.d/ fragments: AL2023's stock nginx.conf
  # ships its own `server { listen 80 default_server; }`, and a second
  # default_server in conf.d/ refuses to start while a non-default one gets
  # shadowed - either way the ALB ends up hitting nginx's welcome page
  # instead of the app, and /healthz 404s forever.
  server {
    listen 80 default_server;
    server_name _;

    # ALB health check target - must stay unprefixed so the target group's
    # /healthz check keeps working unchanged.
    location /healthz {
      proxy_pass         http://127.0.0.1:8080;
      proxy_http_version 1.1;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Trailing slash on proxy_pass strips the /api prefix, so the frontend's
    # same-origin /api/v1/... calls (see frontend/next.config.ts's dev-time
    # rewrite) reach Express as /v1/... in production too.
    location /api/ {
      proxy_pass         http://127.0.0.1:8080/;
      proxy_http_version 1.1;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location / {
      proxy_pass         http://127.0.0.1:3000;
      proxy_http_version 1.1;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
    }
  }
}
